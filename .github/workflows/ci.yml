name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ClearC.slnx
      - name: Build
        run: dotnet build ClearC.slnx -c Release --no-restore
      - name: Format
        run: dotnet format ClearC.slnx --verify-no-changes --severity warn
      - name: Test core
        run: dotnet test tests/ClearC.Core.Tests/ClearC.Core.Tests.csproj -c Release --no-build
      - name: Test desktop
        run: dotnet test tests/ClearC.Desktop.Tests/ClearC.Desktop.Tests.csproj -c Release --no-build

  # AOT 产物冒烟：NativeAOT 只在真正发布时才暴露裁剪问题（§8.2）。
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify MSVC toolchain (NativeAOT prerequisite)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found." }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "MSVC x64 build tools are required for NativeAOT publishing." }
          Write-Host "MSVC: $install"
      - name: Publish win-x64 (AOT)
        run: ./publish_win-x64.bat --no-pause
        shell: cmd
      - name: Smoke test
        run: ./scripts/smoke.ps1 -Path artifacts/publish/win-x64/ClearC/ClearC.Desktop.exe

  # Linux 目标只验证编译与发布流程，运行时会提示"仅支持 Windows"。
  publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ClearC.slnx
      - name: Publish linux-x64
        run: dotnet publish src/ClearC.Desktop/ClearC.Desktop.csproj -c Release -f net10.0 -r linux-x64 --self-contained true -p:PublishTrimmed=true -o artifacts/publish/linux-x64/ClearC
