name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ClearC.slnx
      - name: Build
        run: dotnet build ClearC.slnx -c Release --no-restore
      - name: Test core
        run: dotnet test tests/ClearC.Core.Tests/ClearC.Core.Tests.csproj -c Release --no-build
      - name: Test desktop
        run: dotnet test tests/ClearC.Desktop.Tests/ClearC.Desktop.Tests.csproj -c Release --no-build
