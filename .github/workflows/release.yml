name: release

# 推送 v* 或纯数字标签（如 0.2.0）即发布：win-x64 / win-x86 生成 NativeAOT
# 自包含程序、冒烟验证后用 Inno Setup 打中文安装包，并创建 GitHub Release。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test ClearC.slnx -c Release

  publish:
    name: 发布 ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
            os: windows-latest
          - rid: win-x86
            arch: x86
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v0.2.0 or 0.2.0): $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本：$version"

      - name: 发布
        shell: pwsh
        run: pwsh scripts/publish.ps1 -RuntimeIdentifiers '${{ matrix.rid }}' -Version $env:APP_VERSION

      - name: 冒烟测试（--selfcheck）
        shell: pwsh
        run: pwsh scripts/smoke.ps1 -Path 'artifacts/publish/${{ matrix.rid }}/ClearC/ClearC.Desktop.exe'

      - name: 构建 Windows 安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/ClearC.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DAppArch=${{ matrix.arch }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}\ClearC
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: 计算安装包 SHA-256
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $installerName = "ClearC-v$env:APP_VERSION-win-$env:ARCH-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ClearC-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: ClearC-*
          path: artifacts/release
          merge-multiple: true

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # 沿用被推送的原始标签（v0.2.0 或 0.2.0），避免额外创建新标签。
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v0.2.0 or 0.2.0): $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 准备发布说明
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $curated = ".github/release-notes/v$env:VERSION.md"
          $bodyPath = "artifacts/release-body.md"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bodyPath) -Force | Out-Null
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -Destination $bodyPath -Force
            Write-Host "使用发布说明：$curated"
          }
          else {
            "ClearC v$env:VERSION" | Set-Content -LiteralPath $bodyPath -Encoding utf8
            Write-Host "未找到 $curated，将只使用自动生成的变更说明。"
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ClearC v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.sha256
