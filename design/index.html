<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearC · C盘清理助手（交互原型）</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-state="idle">
<div class="stage">

  <!-- ══════════ 主窗体（唯一入口，所有状态由交互推进） ══════════ -->
  <div class="app-window" id="appWindow">

    <!-- 标题栏：可拖动 / 双击最大化 -->
    <header class="titlebar" id="titlebar">
      <div class="tb-left">
        <span class="app-logo"><svg class="icon"><use href="#i-logo"/></svg></span>
        <b class="app-name">CLEARC</b>
        <span class="tb-sub">C 盘清理助手</span>
      </div>
      <div class="tb-right">
        <button class="tb-btn" id="btnMin" title="最小化"><svg class="icon"><use href="#i-min"/></svg></button>
        <button class="tb-btn" id="btnMax" title="最大化"><svg class="icon"><use href="#i-max"/></svg></button>
        <button class="tb-btn tb-close" id="btnClose" title="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
    </header>

    <main class="page">

      <!-- ── 总览：磁盘环图 + 统计 + 操作 ── -->
      <section class="hero">
        <div class="donut-wrap">
          <svg class="donut" viewBox="0 0 150 150">
            <defs>
              <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#7c5cff"/>
              </linearGradient>
            </defs>
            <circle class="d-track" cx="75" cy="75" r="56"/>
            <circle class="d-fill" id="donutFill" cx="75" cy="75" r="56" transform="rotate(-90 75 75)"/>
          </svg>
          <div class="d-center"><b id="donutPct">67%</b><span>已用</span></div>
        </div>

        <div class="hero-info">
          <div class="hi-title"><b id="hiTitle">C: 系统盘</b><span id="hiSub">Win 10 Pro x64 · SSD · 535.9 GB · NTFS</span></div>
          <div class="hi-stat"><span id="heroLabel">可释放空间</span><b id="heroStat" class="placeholder">待扫描</b></div>
          <div class="hi-sub">已用 <b id="diskUsed">361.4 GB</b> · 可用 <b id="diskFree">174.5 GB</b><span id="diskScope"></span></div>
          <div class="hi-actions">
            <button class="btn primary" id="btnMain"></button>
            <button class="btn ghost" id="btnSecond"></button>
          </div>
          <div class="hi-progress" id="progressWrap" hidden>
            <div class="pbar"><i id="pbarFill"></i></div>
            <span id="progressText"></span>
          </div>
        </div>
      </section>

      <!-- ── 盘符选择（扫描范围，复选框勾选需要扫描的盘符） ── -->
      <section class="diskbar">
        <div class="db-head"><span class="db-title">扫描范围</span><span class="db-hint" id="dbHint"></span></div>
        <div class="db-cards" id="dbCards"></div>
      </section>

      <!-- ── 全选 + 已选统计 ── -->
      <div class="listbar">
        <label class="chk">
          <input type="checkbox" id="checkAll">
          <span class="box"><svg class="icon"><use href="#i-check"/></svg></span>全选
        </label>
        <span class="sel-info" id="selInfo"></span>
      </div>

      <!-- ── 结果清单 ── -->
      <div class="list-zone">
        <div class="list" id="list"></div>
      </div>
    </main>

    <!-- ── 日志视图 ── -->
    <section class="console">
      <div class="con-head">
        <span class="con-title"><i class="tick"></i>运行日志<em id="logCount">0</em></span>
        <span class="con-actions"><button class="mini" id="btnClearLog">清空</button></span>
      </div>
      <div class="con-body" id="logBody"></div>
    </section>

    <!-- ── 状态栏 ── -->
    <footer class="statusbar">
      <span class="sb-left"><i class="dot" id="sbDot"></i><span id="sbText">SYSTEM READY · 等待指令</span></span>
      <span class="sb-right">CLEARC · PROTO · 交互原型</span>
    </footer>
  </div>

  <!-- 最小化后的任务栏胶囊（点击恢复窗口） -->
  <div class="taskbar" id="taskbar" hidden>
    <button id="btnRestore" title="恢复窗口">
      <span class="app-logo"><svg class="icon"><use href="#i-logo"/></svg></span>
      CLEARC · 点击恢复窗口
    </button>
  </div>
</div>

<!-- 右键菜单（打开所在目录 / 复制路径 / 勾选 / 详情） -->
<div class="ctx" id="ctxMenu" hidden></div>

<!-- 确认清理模态框（按当前勾选动态生成） -->
<div class="mask" id="mask" hidden>
  <div class="modal">
    <div class="m-title" id="mTitle"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-actions" id="mActions"></div>
  </div>
</div>

<!-- 关闭应用后的重启层 -->
<div class="mask" id="relaunch" hidden>
  <div class="relaunch-box">
    <span class="app-logo"><svg class="icon"><use href="#i-logo"/></svg></span>
    <div class="relaunch-title">ClearC 已关闭</div>
    <div class="relaunch-sub">原型演示 · 关闭即退出应用，点击下方按钮重新启动</div>
    <button class="btn primary" id="btnRelaunch">重新启动</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
